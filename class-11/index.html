
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Language of Flowers</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>The Language of Flowers</h1>
    <p>Every flower has a story to tell.</p>

    <!-- Mobile: Under 600px -->
    <div class="sunflower">
        <h2>Sunflower</h2>
        <p>Positivity</p>
        <img src="sunflower.jpg" alt="Yellow Sunflower">
        <p>Sunflowers symbolize joy, warmth, and happiness.</p>
    </div>

    <!-- Tablet: 600px to 1199px -->
    <div class="tulip">
        <h2>Tulip</h2>
        <p>New Beginnings</p>
        <img src="tulip.jpg" alt="Pink Tulips">
        <p>Tulips symbolize fresh starts, hope, and renewal.</p>
    </div>

    <!-- Desktop: 1200px and above -->
    <div class="rose">
        <h2>Rose</h2>
        <p>Love</p>
        <img src="rose.jpg" alt="Pink Rose">
        <p>Roses symbolize love, and beauty.</p>
    </div>

</body>
</html>
